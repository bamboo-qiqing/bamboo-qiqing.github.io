<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">手机远程控制流程</title>
  <desc id="desc">Web 或 Android 客户端通过服务端控制本地 Connector 和 Codex</desc>
  <rect width="1200" height="420" rx="18" fill="#f7f8fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="52" y="133" width="250" height="150" rx="12" fill="#ffffff" stroke="#cad2e5" stroke-width="3"/>
    <text x="177" y="183" fill="#1f2937" font-size="24" font-weight="700">Web / Android</text>
    <text x="177" y="222" fill="#5b6475" font-size="18">Session · 审批</text>
    <text x="177" y="250" fill="#5b6475" font-size="18">文件 · 终端</text>
    <rect x="475" y="106" width="250" height="204" rx="12" fill="#3451b2"/>
    <text x="600" y="160" fill="#ffffff" font-size="25" font-weight="700">服务端</text>
    <text x="600" y="201" fill="#e9edff" font-size="18">认证与状态</text>
    <text x="600" y="231" fill="#ffffff" font-size="18">指令转发</text>
    <text x="600" y="261" fill="#ffffff" font-size="18">不运行本地代码</text>
    <rect x="898" y="133" width="250" height="150" rx="12" fill="#ffffff" stroke="#cad2e5" stroke-width="3"/>
    <text x="1023" y="183" fill="#1f2937" font-size="24" font-weight="700">Connector 设备</text>
    <text x="1023" y="222" fill="#5b6475" font-size="18">本地 Codex</text>
    <text x="1023" y="250" fill="#5b6475" font-size="18">工作区 · Shell</text>
    <path d="M302 208h150m273 0h150" fill="none" stroke="#7783a2" stroke-width="4"/>
    <path d="m429 194 21 14-21 14m421-28 21 14-21 14" fill="none" stroke="#7783a2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
